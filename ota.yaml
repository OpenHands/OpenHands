version: 1
project:
  name: OpenHands
  description: OpenHands contributor readiness slice covering the documented local GUI path, the supported Docker runtime path, the community-maintained Docker/devcontainer entry path, and the openhands-ui package build surface; enterprise and release/publish workflows remain out of scope
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
      only_on:
        - linux
        - macos
    host-dev:
      extends: host
      requirements:
        runtimes:
          python: ">=3.12,<3.14"
          node: "^22.12.0"
        tools:
          poetry: ">=2.3.4,<2.4.0"
          npm: ">=10.5.0"
    docker-host:
      extends: host
      requirements:
        tools:
          docker: "*"
    host-ui:
      extends: host
      requirements:
        runtimes:
          node: ">=22.0.0"
        tools:
          bun: ">=1.2.17"
checks:
  - name: netcat-installed
    kind: precondition
    severity: error
    run: sh -c "command -v nc >/dev/null"
    timeout: 10000
  - name: docker-installed
    kind: precondition
    severity: error
    run: docker --version
    timeout: 10000
surfaces:
  backend:
    kind: http
    port: 3000
    path: /health
    readiness:
      kind: http
      method: GET
      path: /health
      success:
        status:
          - 200
      body:
        contains: "OK"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  frontend:
    kind: http
    port: 3001
    path: /
    readiness:
      kind: http
      method: GET
      path: /
      headers:
        Accept: text/html
      success:
        status:
          - 200
      body:
        contains: "<!DOCTYPE html>"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
tasks:
  build:
    context: host-dev
    description: Build and bootstrap the local OpenHands development environment
    notes: |
      This follows the documented self-development quick start in `Development.md`:
      disable the Docker requirement check, prepare the Python and frontend dependencies,
      install pre-commit hooks, and build the frontend assets.
    category: setup
    env:
      INSTALL_DOCKER: "0"
    run: make build
    safe_for_agent: true
  build:frontend:
    context: host-dev
    description: Build the frontend assets only
    notes: |
      This maps directly to the repo's dedicated frontend asset build target.
    category: setup
    env:
      INSTALL_DOCKER: "0"
    run: make build-frontend
    depends_on:
      - build
    safe_for_agent: true
  build:ui:
    context: host-ui
    description: Build the `openhands-ui` package with the repo's CI path
    notes: |
      This follows the dedicated `openhands-ui` build workflow by using Bun inside the package directory.
      It is separate from the main frontend app under `frontend/`.
    category: setup
    run: sh -c 'cd openhands-ui && bun install --frozen-lockfile && bun run build'
    safe_for_agent: true
  lint:backend:
    context: host-dev
    description: Run the backend lint and formatting surface
    notes: |
      This maps directly to the documented backend pre-commit validation flow.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make lint-backend
    depends_on:
      - build
    safe_for_agent: true
  lint:frontend:
    context: host-dev
    description: Run the frontend lint and typecheck surface
    notes: |
      This maps directly to the documented frontend lint path.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make lint-frontend
    depends_on:
      - build
    safe_for_agent: true
  lint:
    context: host-dev
    description: Run the repository aggregate lint surface
    notes: |
      This is the documented aggregate lint entrypoint and covers both backend and frontend checks.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make lint
    depends_on:
      - build
    safe_for_agent: true
  test:frontend:
    context: host-dev
    description: Run the frontend test suite
    notes: |
      This maps directly to the current top-level `make test` target, which runs frontend tests.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make test
    depends_on:
      - build
    safe_for_agent: true
  test:backend:
    context: host-dev
    description: Run the backend Python unit tests
    notes: |
      This follows the documented backend unit test path in `Development.md`.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: poetry run pytest ./tests/unit/test_*.py
    depends_on:
      - build
    safe_for_agent: true
  test:
    context: host-dev
    description: Run the documented frontend and backend test surfaces
    notes: |
      OpenHands documents frontend tests through `make test` and backend tests through pytest.
      This aggregate task composes those two documented test surfaces.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: sh -c 'make test && poetry run pytest ./tests/unit/test_*.py'
    depends_on:
      - build
    safe_for_agent: true
  setup:config-basic:
    context: host
    description: Create a basic config.toml for headless local runtime flows
    notes: |
      This is optional for the web UI path, which can configure the model in the Settings UI
      after startup. It is useful for headless or CLI-oriented local runs.
    category: setup
    internal: true
    run: make setup-config-basic
    safe_for_agent: false
  dev:
    context: host-dev
    description: Run the full local OpenHands GUI development loop
    notes: |
      This follows the documented "Running OpenHands with OpenHands" path in `Development.md`:
      set `INSTALL_DOCKER=0`, set `RUNTIME=local`, then run `make build && make run`.
      It is the narrowest honest contributor-ready path for local GUI work.
    category: dev
    env:
      INSTALL_DOCKER: "0"
      RUNTIME: local
    run: make run
    depends_on:
      - build
    requirements:
      checks:
        - netcat-installed
    runtime:
      kind: service
      surfaces:
        backend: {}
        frontend:
          project:
            host:
              primary: true
    safe_for_agent: false
  dev:backend:
    context: host-dev
    description: Run the backend API server only
    notes: |
      This maps directly to the documented split backend path on port 3000.
    category: dev
    env:
      RUNTIME: local
    run: make start-backend
    depends_on:
      - build
    runtime:
      kind: service
      surfaces:
        - backend
    safe_for_agent: false
  dev:frontend:
    context: host-dev
    description: Run the frontend development server only
    notes: |
      This maps directly to the documented split frontend path on port 3001.
      It is most useful when the backend is already running separately.
    category: dev
    run: make start-frontend
    depends_on:
      - build
    runtime:
      kind: service
      surfaces:
        - frontend
    safe_for_agent: false
  dev:docker-run:
    context: docker-host
    description: Run the documented Dockerized OpenHands runtime
    notes: |
      This maps directly to `make docker-run`, the repo's supported container runtime path when
      you want to run OpenHands without installing host dependencies.
    category: dev
    run: make docker-run
    requirements:
      checks:
        - docker-installed
    runtime:
      kind: service
      surfaces:
        backend: {}
        frontend:
          project:
            host:
              primary: true
    safe_for_agent: false
  env:docker-dev:
    context: docker-host
    description: Enter the community-maintained Docker development environment
    notes: |
      This maps directly to `make docker-dev` / `./containers/dev/dev.sh`.
      The repo documents this as a community-maintained development-container path. It drops you
      into the containerized development environment, after which the normal local build/run flow
      continues inside the container.
    category: setup
    run: make docker-dev
    requirements:
      checks:
        - docker-installed
    safe_for_agent: false
workflows:
  default: app
  app:
    intent: local_development
    description: Canonical local GUI development workflow for OpenHands itself
    notes: |
      This uses the documented self-development path under `Development.md`:
      `INSTALL_DOCKER=0`, `RUNTIME=local`, then `make build && make run`.
      Prefer this when you want the full local GUI loop with explicit readiness on backend and frontend.
      Use `app:docker` when you want the supported container runtime path instead of host dependencies.
      Use `container-dev` when you want to enter the repo's community-maintained Docker development environment.
    setup:
      task: build
    run:
      task: dev
    readiness:
      surfaces:
        - backend
        - frontend
    exposes:
      - surface: backend
      - surface: frontend
  backend:
    intent: backend_development
    description: Backend-only API development workflow
    notes: |
      Use this for focused backend changes when you only need the API server.
    setup:
      task: build
    run:
      task: dev:backend
    readiness:
      surfaces: [backend]
    exposes:
      - surface: backend
  frontend:
    intent: frontend_development
    description: Frontend-only development workflow
    notes: |
      Use this for focused frontend changes when the backend is already available or managed separately.
    setup:
      task: build
    run:
      task: dev:frontend
    readiness:
      surfaces: [frontend]
    exposes:
      - surface: frontend
  app:docker:
    intent: packaged_runtime
    description: Supported Docker runtime workflow for running OpenHands without host dependency setup
    notes: |
      This maps directly to the documented `make docker-run` path in `Development.md`.
      Prefer this when you want the repo's supported container runtime instead of the host-native GUI loop.
    run:
      task: dev:docker-run
    readiness:
      surfaces: [backend, frontend]
    exposes:
      - surface: backend
      - surface: frontend
  container-dev:
    intent: container_development
    description: Community-maintained Docker/devcontainer entry workflow
    notes: |
      This workflow enters the repo's Docker development environment through `make docker-dev`.
      The repo documents this path as community-maintained rather than officially supported.
      Once inside the container, continue with the normal OpenHands build/run workflow there.
    run:
      task: env:docker-dev
  ui-package:
    intent: package_build
    description: Build the `openhands-ui` package using the repo's dedicated Bun-based workflow
    notes: |
      This models the standalone `openhands-ui` package build path that the repo validates in CI.
      It is separate from the main `frontend/` application workflow.
    run:
      task: build:ui

agent:
  entrypoint: build
  default_task: lint
  safe_tasks:
    - build
    - build:frontend
    - build:ui
    - lint:backend
    - lint:frontend
    - lint
    - test:backend
    - test:frontend
    - test
  verify_after_changes:
    - lint:backend
    - lint:frontend
    - test:backend
    - test:frontend
  writable_paths:
    - openhands
    - frontend
    - openhands-ui
    - containers
    - .devcontainer
    - tests
    - scripts
    - Makefile
    - docker-compose.yml
    - pyproject.toml
    - poetry.lock
    - Development.md
    - CONTRIBUTING.md
    - ota.yaml
  protected_paths:
    - enterprise
    - .github/workflows
    - config.toml
  bootstrap:
    ota:
      note: Install ota when missing so contributors and agents can run the declared readiness workflows in this contract.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.15 sh
      powershell: $env:OTA_VERSION='v1.6.15'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    OpenHands documents local contributor setup for macOS, Linux, and WSL.
    Native Windows development is not a supported host path in the repo docs.
    The default Ota workflow intentionally starts from the documented self-development loop in `Development.md`
    rather than inventing a parallel bootstrap path.
    Although the repo carries `uv.lock`, this contract intentionally keeps Python ownership on the
    documented Python + Poetry contributor flow rather than adopting `toolchains.python` prematurely.
    This contract now also covers the supported Docker runtime path, the community-maintained Docker/devcontainer
    entry path, and the standalone `openhands-ui` package build surface.
    It still intentionally leaves enterprise and publish/release workflows out of scope.
