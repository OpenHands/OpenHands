version: 1
project:
  name: OpenHands
  description: OpenHands local GUI contributor readiness slice focused on the documented self-development path, excluding Docker/devcontainer, enterprise, and release/package workflows
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
    host-dev:
      extends: host
      requirements:
        runtimes:
          python: ">=3.12,<3.14"
          node: "^22.12.0"
        tools:
          poetry: ">=2.3.4,<2.4.0"
          npm: ">=10.5.0"
tools:
  poetry:
    version: ">=2.3.4,<2.4.0"
  npm:
    version: ">=10.5.0"
checks:
  - name: netcat-installed
    kind: precondition
    severity: error
    run: sh -c "command -v nc >/dev/null"
    timeout: 10000
surfaces:
  backend:
    kind: http
    port: 3000
    path: /health
    readiness:
      kind: http
      method: GET
      path: /health
      success:
        status:
          - 200
      body:
        contains: "OK"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  frontend:
    kind: http
    port: 3001
    path: /
    readiness:
      kind: http
      method: GET
      path: /
      headers:
        Accept: text/html
      success:
        status:
          - 200
      body:
        contains: "<!DOCTYPE html>"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
tasks:
  build:
    context: host-dev
    description: Build and bootstrap the local OpenHands development environment
    notes: |
      This follows the documented self-development quick start in `Development.md`:
      disable the Docker requirement check, prepare the Python and frontend dependencies,
      install pre-commit hooks, and build the frontend assets.
    category: setup
    env:
      INSTALL_DOCKER: "0"
    run: make build
    safe_for_agent: true
  lint:backend:
    context: host-dev
    description: Run the backend lint and formatting surface
    notes: |
      This maps directly to the documented backend pre-commit validation flow.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make lint-backend
    depends_on:
      - build
    safe_for_agent: true
  lint:frontend:
    context: host-dev
    description: Run the frontend lint and typecheck surface
    notes: |
      This maps directly to the documented frontend lint path.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make lint-frontend
    depends_on:
      - build
    safe_for_agent: true
  lint:
    context: host-dev
    description: Run the repository aggregate lint surface
    notes: |
      This is the documented aggregate lint entrypoint and covers both backend and frontend checks.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make lint
    depends_on:
      - build
    safe_for_agent: true
  test:frontend:
    context: host-dev
    description: Run the frontend test suite
    notes: |
      This maps directly to the current top-level `make test` target, which runs frontend tests.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: make test
    depends_on:
      - build
    safe_for_agent: true
  test:backend:
    context: host-dev
    description: Run the backend Python unit tests
    notes: |
      This follows the documented backend unit test path in `Development.md`.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: poetry run pytest ./tests/unit/test_*.py
    depends_on:
      - build
    safe_for_agent: true
  test:
    context: host-dev
    description: Run the documented frontend and backend test surfaces
    notes: |
      OpenHands documents frontend tests through `make test` and backend tests through pytest.
      This aggregate task composes those two documented test surfaces.
    category: test
    env:
      INSTALL_DOCKER: "0"
    run: sh -c 'make test && poetry run pytest ./tests/unit/test_*.py'
    depends_on:
      - build
    safe_for_agent: true
  setup:config-basic:
    context: host
    description: Create a basic config.toml for headless local runtime flows
    notes: |
      This is optional for the web UI path, which can configure the model in the Settings UI
      after startup. It is useful for headless or CLI-oriented local runs.
    category: setup
    run: make setup-config-basic
    safe_for_agent: false
  dev:
    context: host-dev
    description: Run the full local OpenHands GUI development loop
    notes: |
      This follows the documented "Running OpenHands with OpenHands" path in `Development.md`:
      set `INSTALL_DOCKER=0`, set `RUNTIME=local`, then run `make build && make run`.
      It is the narrowest honest contributor-ready path for local GUI work.
    category: dev
    env:
      INSTALL_DOCKER: "0"
      RUNTIME: local
    run: make run
    depends_on:
      - build
    requirements:
      checks:
        - netcat-installed
    runtime:
      kind: service
      surfaces:
        backend: {}
        frontend:
          project:
            host:
              primary: true
    safe_for_agent: false
  dev:backend:
    context: host-dev
    description: Run the backend API server only
    notes: |
      This maps directly to the documented split backend path on port 3000.
    category: dev
    env:
      RUNTIME: local
    run: make start-backend
    depends_on:
      - build
    runtime:
      kind: service
      surfaces:
        - backend
    safe_for_agent: false
  dev:frontend:
    context: host-dev
    description: Run the frontend development server only
    notes: |
      This maps directly to the documented split frontend path on port 3001.
      It is most useful when the backend is already running separately.
    category: dev
    run: make start-frontend
    depends_on:
      - build
    runtime:
      kind: service
      surfaces:
        - frontend
    safe_for_agent: false
workflows:
  default: app
  app:
    intent: local_development
    description: Canonical local GUI development workflow for OpenHands itself
    notes: |
      This uses the documented self-development path under `Development.md`:
      `INSTALL_DOCKER=0`, `RUNTIME=local`, then `make build && make run`.
      Prefer this when you want the full local GUI loop with explicit readiness on backend and frontend.
      This contract slice intentionally excludes Docker/devcontainer, enterprise, and release/package workflows.
    setup:
      task: build
    run:
      task: dev
    readiness:
      surfaces:
        - backend
        - frontend
    exposes:
      - surface: backend
      - surface: frontend
  backend:
    intent: backend_development
    description: Backend-only API development workflow
    notes: |
      Use this for focused backend changes when you only need the API server.
    setup:
      task: build
    run:
      task: dev:backend
    readiness:
      surfaces:
        - backend
    exposes:
      - surface: backend
  frontend:
    intent: frontend_development
    description: Frontend-only development workflow
    notes: |
      Use this for focused frontend changes when the backend is already available or managed separately.
    setup:
      task: build
    run:
      task: dev:frontend
    readiness:
      surfaces:
        - frontend
    exposes:
      - surface: frontend

agent:
  entrypoint: build
  default_task: lint
  safe_tasks:
    - build
    - lint:backend
    - lint:frontend
    - lint
    - test:backend
    - test:frontend
    - test
  verify_after_changes:
    - lint:backend
    - lint:frontend
    - test:backend
    - test:frontend
  writable_paths:
    - openhands
    - frontend
    - tests
    - scripts
    - Makefile
    - pyproject.toml
    - poetry.lock
    - Development.md
    - CONTRIBUTING.md
    - ota.yaml
  protected_paths:
    - enterprise
    - .github/workflows
    - config.toml
  bootstrap:
    ota:
      note: Install ota when missing so contributors and agents can run the declared readiness workflows in this contract.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.15 sh
      powershell: $env:OTA_VERSION='v1.6.15'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    OpenHands documents local contributor setup for macOS, Linux, and WSL.
    Native Windows development is not a supported host path in the repo docs.
    The default Ota workflow intentionally starts from the documented self-development loop in `Development.md`
    rather than inventing a parallel bootstrap path.
    This current contract covers the local GUI contributor slice only, not Docker/devcontainer, enterprise,
    or package/release workflows.
