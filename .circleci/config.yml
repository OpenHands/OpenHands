version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.1.1

executors:
  python:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
  node:
    docker:
      - image: cimg/node:22.12
    resource_class: medium
  python-node:
    docker:
      - image: cimg/python:3.12-node
    resource_class: large

jobs:
  lint-backend:
    executor: python
    steps:
      - checkout
      - run:
          name: Install pre-commit
          command: pip install pre-commit
      - restore_cache:
          keys:
            - pre-commit-v1-{{ checksum "dev_config/python/.pre-commit-config.yaml" }}
      - run:
          name: Run pre-commit hooks
          command: pre-commit run --all-files --config ./dev_config/python/.pre-commit-config.yaml
      - save_cache:
          key: pre-commit-v1-{{ checksum "dev_config/python/.pre-commit-config.yaml" }}
          paths:
            - ~/.cache/pre-commit

  lint-frontend:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-deps-v1-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: Install dependencies
          working_directory: frontend
          command: npm ci
      - save_cache:
          key: frontend-deps-v1-{{ checksum "frontend/package-lock.json" }}
          paths:
            - frontend/node_modules
      - run:
          name: Lint frontend
          working_directory: frontend
          command: npm run lint

  test-backend:
    executor: python-node
    steps:
      - checkout
      - run:
          name: Install system dependencies
          command: sudo apt-get update && sudo apt-get install -y tmux
      - run:
          name: Install Poetry
          command: pip install poetry
      - restore_cache:
          keys:
            - poetry-deps-v1-{{ checksum "poetry.lock" }}
      - run:
          name: Install Python dependencies
          command: poetry install --with dev,test,runtime
      - save_cache:
          key: poetry-deps-v1-{{ checksum "poetry.lock" }}
          paths:
            - .venv
            - ~/.cache/pypoetry
      - run:
          name: Run backend tests
          command: poetry run pytest --forked -n auto -s ./tests/unit
          no_output_timeout: 15m

  test-frontend:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-deps-v1-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: Install dependencies
          working_directory: frontend
          command: npm ci
      - save_cache:
          key: frontend-deps-v1-{{ checksum "frontend/package-lock.json" }}
          paths:
            - frontend/node_modules
      - run:
          name: Build frontend
          working_directory: frontend
          command: npm run build
      - run:
          name: Run frontend tests with coverage
          working_directory: frontend
          command: npm run test:coverage

  build:
    executor: python-node
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            docker build \
              -f containers/app/Dockerfile \
              -t openhands:build \
              .
          no_output_timeout: 30m

  publish:
    executor: python-node
    parameters:
      image-name:
        type: string
        default: openhands
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: "${B1_ROLE_ARN}"
          region: "${AWS_REGION}"
      - run:
          name: "Login to ECR"
          command: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin \
              653306034207.dkr.ecr.$AWS_REGION.amazonaws.com
      - run:
          name: "Build image"
          command: |
            VERSION="${CIRCLE_TAG:-$CIRCLE_BRANCH}"
            NAME="openhands"
            REPOSITORY=653306034207.dkr.ecr.$AWS_REGION.amazonaws.com/b1
            docker build . -f containers/app/Dockerfile \
              -t "${REPOSITORY}/${NAME}:${VERSION}" \
              --build-arg BUILD_VERSION="${VERSION}" \
              --build-arg BUILD_DATE="$(date)" \
              --build-arg BUILD_NAME="${NAME}" \
              --build-arg BUILD_IMAGE="${REPOSITORY}/${NAME}"
          no_output_timeout: 30m
      - run:
          name: "Publish image"
          command: |
            VERSION="${CIRCLE_TAG:-$CIRCLE_BRANCH}"
            NAME="openhands"
            REPOSITORY=653306034207.dkr.ecr.$AWS_REGION.amazonaws.com/b1
            docker push "${REPOSITORY}/${NAME}:${VERSION}"

workflows:
  lint:
    jobs:
      - lint-backend:
          filters:
            branches:
              only: /.*/
      - lint-frontend:
          filters:
            branches:
              only: /.*/

  # test:
  #   jobs:
  #     - test-backend:
  #         filters:
  #           branches:
  #             only: /.*/
  #     - test-frontend:
  #         filters:
  #           branches:
  #             only: /.*/

  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - develop

  publish:
    jobs:
      - publish:
          context: build-defaults
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
