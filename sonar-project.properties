sonar.projectKey=openhands
sonar.projectName=openhands

# __tests__/ and tests/ are top-level test trees. Test files are ALSO co-located under
# src/ (e.g. foo.test.tsx); those are excluded from sources below so SonarQube does not
# count them as uncovered production code -- vitest excludes test files from coverage too.
sonar.sources=src
sonar.tests=__tests__,tests

# Trailing globs drop co-located test files from source analysis so they don't dilute coverage.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,public/**,docs/**,helm/**,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Written by `npm run test:coverage` in the scan workflow. vite.config.ts emits lcov and
# its coverage include is src/**, so analysis is scoped to src to match the covered set --
# electron/ is deliberately out of scope (it has no coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
