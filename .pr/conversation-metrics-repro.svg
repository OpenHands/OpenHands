<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Conversation usage metrics regression test</title>
  <desc id="desc">A terminal-style reproduction shows null metrics before the fix and combined cost after the fix.</desc>
  <rect width="960" height="500" rx="12" fill="#171717"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="7" fill="#febc2e"/>
  <circle cx="78" cy="28" r="7" fill="#28c840"/>
  <text x="32" y="82" fill="#dcdcaa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">$ searchConversations() -- conversation with stats.usage_to_metrics</text>
  <text x="32" y="126" fill="#f48771" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">before: AppConversation.metrics = null</text>
  <text x="32" y="160" fill="#9cdcfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">wire: stats.usage_to_metrics = { agent: { cost: 1.25 },</text>
  <text x="32" y="190" fill="#9cdcfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">                         condenser: { cost: 0.75 } }</text>
  <line x1="32" y1="226" x2="928" y2="226" stroke="#444"/>
  <text x="32" y="270" fill="#b5cea8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">after:  AppConversation.metrics.accumulated_cost = 2</text>
  <text x="32" y="304" fill="#b5cea8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">        token usage combines agent + condenser entries</text>
  <text x="32" y="370" fill="#dcdcaa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">targeted test: 120 passed</text>
  <text x="32" y="400" fill="#dcdcaa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">typecheck / lint / build: passed</text>
  <text x="32" y="450" fill="#808080" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">OpenHands #16480</text>
</svg>
