<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode preset validation ladder</title><desc id="desc">Four validation layers cover registry fidelity, UI behavior, persistence, and a real OpenCode turn.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".5"/></filter><style>.t{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.st{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.n{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.p{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.k{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#86efac}.a{stroke:#60a5fa;stroke-width:4;fill:none}</style></defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/><text x="64" y="66" class="t">Validation ladder</text><text x="64" y="96" class="st">A preset is not done until the real ACP process answers</text>
  <path d="M195 300H1205" class="a"/><g filter="url(#s)">
    <rect x="70" y="164" width="250" height="260" rx="20" fill="#172033" stroke="#334155"/><circle cx="108" cy="205" r="18" fill="#166534"/><text x="101" y="212" class="n">✓</text><text x="140" y="211" class="n">Registry fidelity</text><text x="94" y="257" class="p">Command / model / secrets</text><text x="94" y="283" class="p">match the shared client data</text><text x="94" y="334" class="k">UNIT</text><text x="94" y="370" class="p">No copied literals</text><text x="94" y="394" class="p">Unknown providers still fall back</text>
    <rect x="406" y="164" width="250" height="260" rx="20" fill="#172033" stroke="#334155"/><circle cx="444" cy="205" r="18" fill="#166534"/><text x="437" y="212" class="n">✓</text><text x="476" y="211" class="n">Product surfaces</text><text x="430" y="257" class="p">Onboarding tile, icon and copy</text><text x="430" y="283" class="p">Settings provider selection</text><text x="430" y="334" class="k">UI TESTS</text><text x="430" y="370" class="p">15 locales complete</text><text x="430" y="394" class="p">Kimi and Pi remain hidden</text>
    <rect x="742" y="164" width="250" height="260" rx="20" fill="#172033" stroke="#334155"/><circle cx="780" cy="205" r="18" fill="#166534"/><text x="773" y="212" class="n">✓</text><text x="812" y="211" class="n">Persistence</text><text x="766" y="257" class="p">Save provider; defer default command</text><text x="766" y="283" class="p">Reload and re-detect OpenCode</text><text x="766" y="334" class="k">INTEGRATION</text><text x="766" y="370" class="p">Local credentials may be skipped</text><text x="766" y="394" class="p">Cloud requires a saved key</text>
    <rect x="1078" y="164" width="250" height="260" rx="20" fill="#102b25" stroke="#22c55e"/><circle cx="1116" cy="205" r="18" fill="#166534"/><text x="1109" y="212" class="n">✓</text><text x="1148" y="211" class="n">Real ACP turn</text><text x="1102" y="257" class="p">Agent Server 1.49.6</text><text x="1102" y="283" class="p">OpenCode 1.18.23</text><text x="1102" y="334" class="k">LIVE E2E</text><text x="1102" y="370" class="p">opencode/big-pickle</text><text x="1102" y="394" class="p">agent + model identified</text>
  </g><text x="64" y="505" class="st">Result: 750 test files · 7,921 tests passed · build passed · real app-path reply passed</text>
</svg>
