<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode 一等 ACP Preset 架构</title>
  <desc id="desc">共享 ACP 注册表向 Canvas 展示层、引导与设置、持久化配置、Agent Server 以及 OpenCode ACP 进程提供数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#60a5fa"/></marker>
    <style>.title{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#94a3b8}.h{font:700 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}.p{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#cbd5e1}.tag{font:600 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#bfdbfe;letter-spacing:.06em}.line{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="64" class="title">让 OpenCode 成为一等 ACP Preset</text>
  <text x="64" y="94" class="subtitle">一个事实源、两个产品入口、一条真实验证链路</text>
  <g filter="url(#shadow)">
    <rect x="64" y="160" width="280" height="190" rx="20" fill="#172033" stroke="#334155"/><rect x="64" y="160" width="280" height="8" rx="4" fill="url(#blue)"/>
    <text x="88" y="205" class="tag">唯一事实源</text><text x="88" y="242" class="h">共享 ACP 注册表</text><text x="88" y="274" class="p">默认启动命令</text><text x="88" y="299" class="p">默认模型 / 可用模型</text><text x="88" y="324" class="p">凭证字段定义</text>
    <rect x="438" y="140" width="300" height="230" rx="20" fill="#172033" stroke="#2563eb"/>
    <text x="464" y="184" class="tag">CANVAS 适配层</text><text x="464" y="221" class="h">只负责呈现，不复制事实</text><text x="464" y="255" class="p">可见 Provider 白名单</text><text x="464" y="280" class="p">OpenCode 品牌图标与多语言文案</text><text x="464" y="305" class="p">buildAcpAgentSettingsDiff()</text><text x="464" y="330" class="p">保存 Provider / 模型，委托命令解析</text>
    <rect x="830" y="122" width="240" height="120" rx="18" fill="#152238" stroke="#38bdf8"/><text x="854" y="164" class="tag">入口 01</text><text x="854" y="199" class="h">首次引导</text><text x="854" y="224" class="p">Preset 卡片 + 凭证步骤</text>
    <rect x="830" y="276" width="240" height="120" rx="18" fill="#152238" stroke="#38bdf8"/><text x="854" y="318" class="tag">入口 02</text><text x="854" y="353" class="h">设置页</text><text x="854" y="378" class="p">编辑、保存、刷新、重新识别</text>
    <rect x="438" y="470" width="300" height="154" rx="20" fill="#172033" stroke="#475569"/><text x="464" y="512" class="tag">持久化契约</text><text x="464" y="548" class="h">Agent Settings Diff</text><text x="464" y="578" class="p">acp_server = opencode</text><text x="464" y="602" class="p">命令与模型刷新后不丢失</text>
    <rect x="830" y="470" width="240" height="154" rx="20" fill="#172033" stroke="#475569"/><text x="854" y="512" class="tag">运行时边界</text><text x="854" y="548" class="h">Agent Server</text><text x="854" y="578" class="p">解析 LookupSecret</text><text x="854" y="602" class="p">拉起隔离的 ACP 进程</text>
    <rect x="1160" y="470" width="176" height="154" rx="20" fill="#102b25" stroke="#22c55e"/><text x="1184" y="512" class="tag" fill="#bbf7d0">真实进程</text><text x="1184" y="548" class="h">OpenCode</text><text x="1184" y="578" class="p">Big Pickle</text><text x="1184" y="602" class="p">返回真实 ACP 回复</text>
  </g>
  <path d="M344 255H420" class="line"/><path d="M738 210C778 210 786 182 812 182" class="line"/><path d="M738 300C778 300 786 336 812 336" class="line"/><path d="M950 242V450H738" class="line"/><path d="M950 396V450H738" class="line"/><path d="M738 547H812" class="line"/><path d="M1070 547H1142" class="line"/>
  <rect x="64" y="662" width="1272" height="2" fill="#243244"/><circle cx="78" cy="692" r="6" fill="#22c55e"/><text x="94" y="697" class="p">Canvas 负责产品呈现</text><circle cx="334" cy="692" r="6" fill="#60a5fa"/><text x="350" y="697" class="p">注册表负责 Provider 数据</text><circle cx="684" cy="692" r="6" fill="#f59e0b"/><text x="700" y="697" class="p">Agent Server 负责进程隔离</text>
</svg>
