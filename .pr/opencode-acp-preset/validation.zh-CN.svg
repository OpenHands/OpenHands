<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Preset 验证阶梯</title><desc id="desc">四层验证覆盖注册表一致性、界面行为、持久化以及真实 OpenCode 对话。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".5"/></filter><style>.t{font:700 32px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}.st{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#94a3b8}.n{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}.p{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#cbd5e1}.k{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#86efac}.a{stroke:#60a5fa;stroke-width:4;fill:none}</style></defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/><text x="64" y="66" class="t">验证阶梯</text><text x="64" y="96" class="st">只有真实 ACP 进程成功回复，Preset 才算完成</text><path d="M195 300H1205" class="a"/>
  <g filter="url(#s)">
    <rect x="70" y="164" width="250" height="260" rx="20" fill="#172033" stroke="#334155"/><circle cx="108" cy="205" r="18" fill="#166534"/><text x="101" y="212" class="n">✓</text><text x="140" y="211" class="n">注册表一致性</text><text x="94" y="257" class="p">命令 / 模型 / 凭证字段</text><text x="94" y="283" class="p">全部来自共享 Client 数据</text><text x="94" y="334" class="k">单元测试</text><text x="94" y="370" class="p">不复制硬编码事实</text><text x="94" y="394" class="p">未知 Provider 仍安全降级</text>
    <rect x="406" y="164" width="250" height="260" rx="20" fill="#172033" stroke="#334155"/><circle cx="444" cy="205" r="18" fill="#166534"/><text x="437" y="212" class="n">✓</text><text x="476" y="211" class="n">产品入口</text><text x="430" y="257" class="p">首次引导卡片、图标、文案</text><text x="430" y="283" class="p">设置页 Provider 选择</text><text x="430" y="334" class="k">界面测试</text><text x="430" y="370" class="p">15 种语言完整</text><text x="430" y="394" class="p">Kimi 与 Pi 仍保持隐藏</text>
    <rect x="742" y="164" width="250" height="260" rx="20" fill="#172033" stroke="#334155"/><circle cx="780" cy="205" r="18" fill="#166534"/><text x="773" y="212" class="n">✓</text><text x="812" y="211" class="n">持久化</text><text x="766" y="257" class="p">保存 Provider，委托默认命令</text><text x="766" y="283" class="p">刷新后重新识别 OpenCode</text><text x="766" y="334" class="k">集成测试</text><text x="766" y="370" class="p">本地环境可跳过凭证</text><text x="766" y="394" class="p">云端环境要求保存 Key</text>
    <rect x="1078" y="164" width="250" height="260" rx="20" fill="#102b25" stroke="#22c55e"/><circle cx="1116" cy="205" r="18" fill="#166534"/><text x="1109" y="212" class="n">✓</text><text x="1148" y="211" class="n">真实 ACP 对话</text><text x="1102" y="257" class="p">Agent Server 1.49.6</text><text x="1102" y="283" class="p">OpenCode 1.18.23</text><text x="1102" y="334" class="k">真实端到端</text><text x="1102" y="370" class="p">opencode/big-pickle</text><text x="1102" y="394" class="p">回复明确标识 Agent 与模型</text>
  </g><text x="64" y="505" class="st">结果：750 个测试文件 · 7,921 项测试通过 · 构建通过 · 真实应用链路回复通过</text>
</svg>
