# OpenHands deployment for Portainer (Traefik-based routing)
volumes:
  openhands_state:
  openhands_workspace:
  openhands-registry-cache:
    name: ${STACK}-registry-cache
  openhands-package-cache:
    name: ${STACK}-package-cache

networks:
  openhands-net:
    name: ${STACK}-openhands-net
    driver: bridge
  traefik:
    external: true

services:
  openhands:
    image: 653306034207.dkr.ecr.eu-central-1.amazonaws.com/b1/openhands:${VERSION}
    restart: unless-stopped
    hostname: openhands-app
    environment:
      # --- LLM Configuration ---
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-opus-4-6}
      - LLM_BASE_URL=${LLM_BASE_URL:-}

      # --- Auth ---
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://auth-develop.test.build.one}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - B1_SYSTEM_USER_EMAIL=${B1_SYSTEM_USER_EMAIL:-system@build.one}
      - B1_SYSTEM_USER_PASSWORD=${B1_SYSTEM_USER_PASSWORD:-}

      # --- Sandbox / Runtime ---
      - SANDBOX_USER_ID=${SANDBOX_USER_ID:-0}
      - WORKSPACE_MOUNT_PATH=/opt/workspace_base
      - OH_SANDBOX__RESOURCE_PREFIX=${STACK}
      - OH_SANDBOX__CONTAINER_NAME_PREFIX=${STACK}-agent-server-
      - OH_SANDBOX__NETWORK=${STACK}-openhands-net
      - OH_SANDBOX__APP_HOSTNAME=openhands-app
      - OH_SANDBOX__PRIVILEGED=true
      - OH_SANDBOX__DIND_REGISTRY_MIRROR_URL=http://${STACK}-registry-cache:5000
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-}

      # --- Env vars forwarded into sandbox containers (OH_SANDBOX_FWD__ prefix is stripped) ---
      - OH_SANDBOX_FWD__AUTH_URL=${BETTER_AUTH_URL:-https://auth-develop.test.build.one}
      - OH_SANDBOX_FWD__BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - OH_SANDBOX_FWD__B1_SYSTEM_USER_EMAIL=${B1_SYSTEM_USER_EMAIL:-system@build.one}
      - OH_SANDBOX_FWD__B1_SYSTEM_USER_PASSWORD=${B1_SYSTEM_USER_PASSWORD:-}
      - OH_SANDBOX_FWD__OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OH_SANDBOX_FWD__LMNR_PROJECT_API_KEY=${LMNR_PROJECT_API_KEY:-}

      # --- Make sandbox containers visible in Portainer ---
      - 'OH_SANDBOX_CONTAINER_LABELS={"com.docker.compose.project": "${STACK}", "com.docker.compose.service": "agent-server"}'
      # --- Traefik routing for agent sandbox containers ---
      - OH_SANDBOX__TRAEFIK_NETWORK=traefik
      - OH_SANDBOX__TRAEFIK_DOMAIN=${DOMAIN}
      - OH_SANDBOX__TRAEFIK_ENTRYPOINTS=${ENTRYPOINTS:-web}
      - OH_SANDBOX__TRAEFIK_WORKER_PORTS=WORKER_2
      - OH_SANDBOX__TRAEFIK_SUBDOMAIN_PREFIX=${STACK}
    networks:
      openhands-net:
      traefik:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.${STACK}-openhands.rule=Host(`${STACK}.${DOMAIN}`)
      - traefik.http.routers.${STACK}-openhands.entrypoints=${ENTRYPOINTS:-web}
      - traefik.http.services.${STACK}-openhands.loadbalancer.server.port=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands_state:/.openhands
      - openhands_workspace:/opt/workspace_base
    stdin_open: true
    tty: true
    depends_on:
      - registry-cache

  registry-cache:
    image: registry:2
    container_name: ${STACK}-registry-cache
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io
    volumes:
      - openhands-registry-cache:/var/lib/registry
    networks:
      openhands-net:
    restart: unless-stopped
