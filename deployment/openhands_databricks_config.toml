# OpenHands — sample configuration for Databricks AI Gateway
#
# Copy this file and fill in your workspace credentials.
# Never commit a copy that contains real tokens or hostnames.
#
# Usage:
#   export DATABRICKS_HOST=https://your-workspace.cloud.databricks.com
#   export DATABRICKS_TOKEN=<your-PAT-or-use-M2M-below>
#   python -m openhands.core.main --config config.toml

[core]
max_iterations = 100
default_agent = "CodeActAgent"
workspace_base = "/tmp/openhands-workspace"

[llm]
# Databricks Foundation Model API via AI Gateway
# Replace <endpoint-name> with the serving endpoint name in your workspace,
# e.g. databricks-claude-sonnet-4-5, databricks-meta-llama-3-3-70b-instruct
model = "databricks/<endpoint-name>"

# Workspace host — reads from DATABRICKS_HOST env var if omitted here.
# base_url = "https://your-workspace.cloud.databricks.com"

# Auth — reads from DATABRICKS_TOKEN env var if omitted here.
# api_key = ""   # PAT; or use M2M env vars (see README)

[sandbox]
timeout = 120

# Environment variables injected into the runtime sandbox.
# OH_DATABRICKS_INTEGRATION enables the PWAF User-Agent plugin
# (sets User-Agent: OpenHandsOSS/<version> on every Databricks HTTP call).
runtime_startup_env_vars = {
    OH_DATABRICKS_INTEGRATION = "true",

    # Workspace host if not already set in the outer environment:
    # DATABRICKS_HOST = "https://your-workspace.cloud.databricks.com",

    # Token — prefer env var over config file to avoid accidental commits:
    # DATABRICKS_TOKEN = "",
}
