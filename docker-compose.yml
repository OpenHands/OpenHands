services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/Dockerfile
    image: openhands:latest
    container_name: openhands-app-${DATE:-}
    environment:
      # Use a locally-built image on top of ghcr.io/openhands/agent-server:1.18.0-python
      # that adds networking & dev CLIs the minimal base is missing
      # (ip/ifconfig/ss/netstat/lsof/nmap/jq/rg/fd/tcpdump/dig/traceroute/...).
      # See containers/sandbox-tools/Dockerfile.
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-openhands-sandbox-tools}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-1.18.0}
      #- SANDBOX_USER_ID=${SANDBOX_USER_ID:-1234} # enable this only if you want a specific non-root sandbox user but you will have to manually adjust permissions of ~/.openhands for this user
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_BASE:-$PWD/workspace}
      # Give the sandbox agent-server enough time to finish startup (WSL2 / slow hosts need >15s).
      - SANDBOX_STARTUP_GRACE_SECONDS=${SANDBOX_STARTUP_GRACE_SECONDS:-120}
      # Forward extra env vars (as JSON) into the sandbox. Set OH_AGENT_SERVER_ENV in .env, e.g.:
      #   OH_AGENT_SERVER_ENV={"OLLAMA_API_BASE":"http://host.docker.internal:11434"}
      # This is required for litellm cost calculation with Ollama models.
      - OH_AGENT_SERVER_ENV=${OH_AGENT_SERVER_ENV:-}
      # LLM defaults — points at a host-local Ollama instance if present.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen2.5-coder:14b}
      - LLM_API_KEY=${LLM_API_KEY:-dummy}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ${WORKSPACE_BASE:-$PWD/workspace}:/opt/workspace_base
      # Optional NinjaTrader 8 mounts for local Windows setups only:
      # - ${NT_CUSTOM_PATH}:/ninjatrader/Custom
      # - ${NT_BIN_PATH}:/ninjatrader/bin:ro
    restart: unless-stopped
