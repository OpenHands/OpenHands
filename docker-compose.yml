
services:

  # SGLang Inference Server - עם מודל Qwen2.5-Coder-14B-Instruct-GPTQ-Int4
  sglang:
    image: lmsysorg/sglang:latest
    container_name: openhands-sglang
    runtime: nvidia
    ports:
      - "30000:30000"  # פורט פנימי ב-Container
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MODEL_NAME=Qwen/Qwen2.5-Coder-14B-Instruct-GPTQ-Int4
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen2.5-Coder-14B-Instruct-GPTQ-Int4
      --host 0.0.0.0
      --port 30000
      --mem-fraction-static 0.8
      --tp 1
    volumes:
      - /mnt/nvme/ollama_models:/root/.cache/huggingface
    networks:
      - openhands-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # OpenHands Main Application - עם גישה מלאה לשרת
  openhands:
    build:
      context: .
      dockerfile: containers/app/Dockerfile
    container_name: openhands-app
    privileged: true  # גישה מלאה למערכת
    depends_on:
      sglang:
        condition: service_started
      invariant-server:
        condition: service_started
    env_file:
      - .env
    ports:
      - "3002:3000"
    environment:
      # LLM Configuration - SGLang עם מודל Qwen2.5-Coder-14B-Instruct-GPTQ-Int4
      - LLM_MODEL=openai/Qwen/Qwen2.5-Coder-14B-Instruct-GPTQ-Int4
      - LLM_BASE_URL=http://172.17.0.1:30000/v1
      - LLM_API_KEY=
      # Qwen2.5-Coder-14B לא תומך ב-native tool calling כראוי, משביתים אותו
      # כפוי ל-string-based function calling
      - LLM_NATIVE_TOOL_CALLING=false
      
      # Execution Mode
      - EXECUTION_MODE=local
      - RUNTIME=local
      - SANDBOX_EXECUTION_MODE=disabled
      - ENABLE_SANDBOX=false
      - CORE_RUNTIME=local
      - AGENT_SERVER_URL=http://agent-server-main:8002
      
      # Security Analyzer
      - SECURITY_ANALYZER_URL=http://invariant-server:8000
      
      # Workspace
      - WORKSPACE_BASE=/workspace
      
      # Browser
      - ENABLE_BROWSER=true
      - BROWSER_HEADLESS=false
      - CODEACT_ENABLE_BROWSING=true
      - ENABLE_BROWSER_ACTIONS=true
      - ENABLE_WEB_BROWSING=true
      - ALLOW_BROWSER_EXEC=true
      
      # גישה לשרת
      - HOST_SYSTEM_ACCESS=true
      - SANDBOX_API_HOSTNAME=host.docker.internal
      - DOCKER_HOST_ADDR=host.docker.internal
      # Container URL Host - IP של המארח כדי שה-frontend יוכל לגשת
      - HOST_IP=10.0.0.13
      
      # CORS Configuration - מאפשר ל-frontend לגשת ל-agent-server
      - PERMITTED_CORS_ORIGINS=http://10.0.0.13:3002
      
      # Agent Server Image Configuration - משתמש ב-image מותאם עם תמיכה ב-CORS
      - AGENT_SERVER_IMAGE_REPOSITORY=openhands-agent-server-custom
      - AGENT_SERVER_IMAGE_TAG=latest
      
      # MCP Configuration - משבית כדי למנוע בעיות חיבור
      - ENABLE_MCP=false
      
    volumes:
      # Workspace
      - ./workspace:/workspace
      - /home/noya/openhands_data:/app/.openhands-state
      # Config file
      - ./config.toml:/app/config.toml:ro
      
      # גישה למערכת - תהליכים
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
      
      # גישה ל-Docker
      - /var/run/docker.sock:/var/run/docker.sock:rw
      
      # גישה ל-systemd ולוגים
      - /run/systemd:/host/run/systemd:ro
      - /var/log:/host/var/log:ro
      - /etc/systemd:/host/etc/systemd:ro
      
      # גישה לקבצי מערכת
      - /etc:/host/etc:ro
      - /usr/bin:/host/usr/bin:ro
      - /usr/sbin:/host/usr/sbin:ro
      
      # גישה לרשת
      - /etc/hosts:/host/etc/hosts:ro
      - /etc/resolv.conf:/host/etc/resolv.conf:ro
      
      # גישה לנתונים נוספים
      - /home:/host/home:ro
      - /opt:/host/opt:ro
      - /mnt:/host/mnt:ro
      - /media:/host/media:ro
      
      # גישה ל-logs נוספים
      - /var/lib/docker:/host/var/lib/docker:ro
      
    # Capabilities נוספות
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - NET_RAW
      - SYS_RESOURCE
      - DAC_OVERRIDE
      
    # Network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    networks:
      - openhands-network
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # Security Analyzer (Invariant)
  invariant-server:
    image: ghcr.io/invariantlabs-ai/server:openhands
    container_name: openhands-invariant-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - openhands-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Code Server (IDE)
  code-server:
    image: codercom/code-server:latest
    container_name: openhands-code-server
    ports:
      - "8081:8080"
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-openhands123}
    volumes:
      - ./workspace:/home/coder/workspace
      - ./code-server-data:/home/coder/.local/share/code-server
      # גישה לשרת גם ב-Code Server
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - openhands-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus - ניטור ומטריקות
  prometheus:
    image: prom/prometheus:latest
    container_name: openhands-prometheus
    ports:
      - "9092:9090"  # Changed from 9090 due to Cursor conflict
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - openhands-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - דשבורדים ויזואליזציה
  grafana:
    image: grafana/grafana:latest
    container_name: openhands-grafana
    ports:
      - "3003:3000"  # Changed from 3001 due to Cursor conflict
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://10.0.0.13:3003
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - openhands-network
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main Agent Server - עם כל התיקונים והפאצ'ים
  agent-server-main:
    image: openhands/agent-server:patched
    container_name: agent-server-main
    # Port 8002 is exposed internally only (no host mapping to avoid conflicts)
    expose:
      - "8002"
    environment:
      # LLM Configuration - חייב להיות זהה ל-openhands-app
      - LLM_MODEL=openai/Qwen/Qwen2.5-Coder-14B-Instruct-GPTQ-Int4
      - LLM_BASE_URL=http://172.17.0.1:30000/v1
      - LLM_API_KEY=
      - LLM_NATIVE_TOOL_CALLING=false
      # Agent Server URL for internal communication
      - AGENT_SERVER_URL=http://agent-server-main:8002
      # CORS Configuration
      - PERMITTED_CORS_ORIGINS=http://10.0.0.13:3002
    volumes:
      - ./workspace:/workspace
      - ./config.toml:/app/config.toml:ro
      - ./sdk_patches:/tmp/sdk_patches:ro
    networks:
      - openhands-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  openhands-network:
    driver: bridge
    name: openhands-network

volumes:
  ollama_models:
    name: openhands-ollama-models
  openhands_data:
    name: openhands-data
  code-server-data:
    name: openhands-code-server-data
  prometheus-data:
    name: openhands-prometheus-data
  grafana-data:
    name: openhands-grafana-data
