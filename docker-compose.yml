services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ~/.ollama:/root/.ollama
    restart: unless-stopped

  openhands:
    image: openhands:latest
    container_name: openhands-app
    depends_on:
      - ollama
    ports:
      - "3004:3000"
    environment:
      # LLM
      LLM_MODEL: "ollama/qwen2.5:14b"
      LLM_BASE_URL: "http://ollama:11434"
      LLM_API_KEY: "ollama"

      # 🔴 זה הקריטי
      EXECUTION_MODE: "local"
      RUNTIME: "local"
    volumes:
      - ./workspace:/workspace
    restart: unless-stopped
