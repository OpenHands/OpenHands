services:
  openhands:
    build:
      context: ./
      dockerfile: ./containers/app/Dockerfile
    image: openhands:latest
    container_name: openhands-app-${DATE:-}
    hostname: openhands-app
    environment:
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://auth-develop.test.build.one}
      - CODESPACE_NAME=${CODESPACE_NAME:-}
      - GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-ghcr.io/openhands/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-31536c8-python}
      #- SANDBOX_USER_ID=${SANDBOX_USER_ID:-1234} # enable this only if you want a specific non-root sandbox user but you will have to manually adjust permissions of ~/.openhands for this user
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_BASE:-$PWD/workspace}
      - OH_SANDBOX__RESOURCE_PREFIX=${OH_SANDBOX__RESOURCE_PREFIX:-openhands}
      - OH_SANDBOX__NETWORK=openhands-net
      - OH_SANDBOX__APP_HOSTNAME=openhands-app
      - 'OH_SANDBOX_CONTAINER_LABELS={"com.docker.compose.project": "openhands"}'
      - OH_SANDBOX__PRIVILEGED=true
      - OH_SANDBOX__DIND_REGISTRY_MIRROR_URL=http://openhands-registry-cache:5000
      - SANDBOX_VOLUMES=/var/run/docker.sock:/var/run/docker.sock
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - B1_SYSTEM_USER_EMAIL=${B1_SYSTEM_USER_EMAIL:-system@build.one}
      - B1_SYSTEM_USER_PASSWORD=${B1_SYSTEM_USER_PASSWORD:-}
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-opus-4-6}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # --- Env vars forwarded into sandbox containers (OH_SANDBOX_FWD__ prefix is stripped) ---
      - OH_SANDBOX_FWD__AUTH_URL=${BETTER_AUTH_URL:-https://auth-develop.test.build.one}
      - OH_SANDBOX_FWD__BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - OH_SANDBOX_FWD__B1_SYSTEM_USER_EMAIL=${B1_SYSTEM_USER_EMAIL:-system@build.one}
      - OH_SANDBOX_FWD__B1_SYSTEM_USER_PASSWORD=${B1_SYSTEM_USER_PASSWORD:-}
      - OH_SANDBOX_FWD__OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OH_SANDBOX_FWD__LMNR_PROJECT_API_KEY=${LMNR_PROJECT_API_KEY:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
      - ${WORKSPACE_BASE:-$PWD/workspace}:/opt/workspace_base
    networks:
      - openhands-net
    pull_policy: build
    stdin_open: true
    tty: true
    depends_on:
      - registry-cache

  registry-cache:
    image: registry:2
    container_name: openhands-registry-cache
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io
    volumes:
      - openhands-registry-cache:/var/lib/registry
    networks:
      - openhands-net
    restart: unless-stopped

volumes:
  openhands-registry-cache:

networks:
  openhands-net:
    name: openhands-net
    driver: bridge
