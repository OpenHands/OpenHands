{{- if and .Values.claude.oauthToken (not .Values.claude.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openhands-claude.fullname" . }}-claude-token
  labels:
    {{- include "openhands-claude.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.claude.existingSecretKey }}: {{ .Values.claude.oauthToken | quote }}
{{- end }}
