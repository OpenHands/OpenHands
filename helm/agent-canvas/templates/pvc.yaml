{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent-canvas.pvcClaimName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-canvas.labels" . | nindent 4 }}
  annotations:
    # Match the StatefulSet volumeClaimTemplates lifecycle: uninstalling the
    # release must not delete user conversations, settings, or workspaces.
    helm.sh/resource-policy: keep
    {{- with (omit (default (dict) .Values.persistence.annotations) "helm.sh/resource-policy") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
