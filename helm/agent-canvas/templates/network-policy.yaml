{{- if .Values.networkPolicy.enabled -}}
{{- $fullName := include "agent-canvas.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-canvas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-canvas.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        # Any pod in the release namespace — the Canvas UI reaches this pod
        # through the Service, and in-namespace jobs may need it directly.
        - podSelector: {}
  # Egress stays open on purpose: the agent talks to LLM providers, package
  # registries, and Cloud APIs on the public internet — an allowlist would
  # break it. DNS rides the same open rule.
  egress:
    - {}
{{- end }}
