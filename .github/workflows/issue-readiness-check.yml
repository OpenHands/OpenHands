---
name: Ready-for-dev Label Policy

# The issue-triage automation owns readiness. This workflow only rejects a
# ready-for-dev label applied by another identity; the resulting unlabeled event
# sends the issue back through triage.

on:
    issues:
        types: [labeled]

concurrency:
    group: ready-for-dev-policy-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    reject-unauthorized-label:
        name: Reject unauthorized ready-for-dev label
        if: >-
            github.event.issue.state == 'open'
            && github.event.issue.pull_request == null
            && github.event.label.name == 'ready-for-dev'
            && github.event.sender.login != 'all-hands-bot'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            issues: write
        steps:
            - name: Remove ready-for-dev label
              env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh issue edit "${{ github.event.issue.number }}"
                  --repo "${{ github.repository }}"
                  --remove-label ready-for-dev
