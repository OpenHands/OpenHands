name: One-time operator formatting

on:
  push:
    branches:
      - feat/operator-readiness
    paths:
      - ".github/workflows/operator-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/operator-readiness

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.5

      - name: Apply repository Ruff rules
        run: |
          ruff check --fix scripts/openhands_operator.py tests/unit/test_openhands_operator.py
          ruff format scripts/openhands_operator.py tests/unit/test_openhands_operator.py
          ruff check scripts/openhands_operator.py tests/unit/test_openhands_operator.py
          ruff format --check scripts/openhands_operator.py tests/unit/test_openhands_operator.py

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/openhands_operator.py tests/unit/test_openhands_operator.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: apply repository Ruff rules"
          git push origin HEAD:feat/operator-readiness
