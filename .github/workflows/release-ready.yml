name: release ready

on:
  pull_request_target:
    types: [ready_for_review]

jobs:
  release-ready:
    permissions:
      # All four are required unconditionally, even when the optional
      # release-test inputs are unset. GitHub validates a called workflow's job
      # permissions statically, before any job runs and regardless of `if:`
      # gating, and release-ready.yml declares jobs needing `actions: write` and
      # `contents: write`. Granting `read` for either kills the run as
      # `startup_failure` with no jobs and no logs. See the consumer snippet in
      # OpenHands/release-actions' README.
      actions: write
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit
    uses: OpenHands/release-actions/.github/workflows/release-ready.yml@main
    with:
      product-name: OpenHands Agent Canvas
      slack-channel: '#proj-agent-canvas'
