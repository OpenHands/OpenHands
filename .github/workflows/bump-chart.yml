# Opens a PR in OpenHands/OpenHands-Cloud pointing the openhands chart's
# image.tag at the enterprise-server image for this tag. tag-image.yml applies
# the tag name to the sha-built image (as soon as its Docker build completes),
# so the image tag matches the git tag verbatim — no prefix stripping needed.
name: Bump chart image tag

on:
  push:
    tags:
      - 'cloud-[0-9]+.[0-9]+.[0-9]+'

jobs:
  bump-chart:
    # secrets: inherit forwards the org secrets RELEASE_APP_ID /
    # RELEASE_APP_PRIVATE_KEY that the reusable workflow needs.
    secrets: inherit
    uses: OpenHands/OpenHands-Cloud/.github/workflows/bump-image-tag.yml@main
    with:
      component: openhands
      chart_file: charts/openhands/values.yaml
      tag: ${{ github.ref_name }}
