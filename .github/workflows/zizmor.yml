name: zizmor

# Results go to code scanning as SARIF instead of failing the job, so existing
# findings on main do not block PRs; code scanning reports only the alerts a PR
# introduces relative to the main baseline produced by the push trigger.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: zizmor-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
