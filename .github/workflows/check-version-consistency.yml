name: Check Version Consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-version-consistency:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check version and Docker image tag consistency
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          import tomllib

          errors = []
          warnings = []

          # ── 1. Extract the canonical version from pyproject.toml ──────────
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)
          version = pyproject["tool"]["poetry"]["version"]
          major_minor = ".".join(version.split(".")[:2])
          print(f"📦 pyproject.toml version: {version} (major.minor: {major_minor})")

          # ── 2. Check frontend/package.json ────────────────────────────────
          with open("frontend/package.json") as f:
              pkg = json.load(f)
          if pkg["version"] != version:
              errors.append(
                  f"frontend/package.json version is '{pkg['version']}', expected '{version}'"
              )
          else:
              print(f"  ✔ frontend/package.json: {pkg['version']}")

          # ── 3. Check frontend/package-lock.json (2 places) ───────────────
          with open("frontend/package-lock.json") as f:
              lock = json.load(f)
          for key, val in [
              ("root.version", lock.get("version")),
              ('packages[""].version', lock.get("packages", {}).get("", {}).get("version")),
          ]:
              if val != version:
                  errors.append(
                      f"frontend/package-lock.json {key} is '{val}', expected '{version}'"
                  )
              else:
                  print(f"  ✔ frontend/package-lock.json {key}: {val}")

          # ── 4. Check runtime image tags in documentation ──────────────────
          # These always use the OpenHands major.minor version pattern.
          runtime_tag_pattern = re.compile(r"runtime:(\d+\.\d+)-nikolaik")

          for filepath in ["Development.md", "openhands/runtime/impl/kubernetes/README.md"]:
              try:
                  with open(filepath) as f:
                      content = f.read()
              except FileNotFoundError:
                  warnings.append(f"{filepath}: file not found, skipping runtime image tag check")
                  continue
              matches = runtime_tag_pattern.findall(content)
              if not matches:
                  warnings.append(f"{filepath}: no runtime image tag found")
                  continue
              for match in matches:
                  if match != major_minor:
                      errors.append(
                          f"{filepath}: runtime image tag is '{match}', expected '{major_minor}'"
                      )
                  else:
                      print(f"  ✔ {filepath} runtime image tag: {match}")

          # ── 5. Check compose files ────────────────────────────────────────
          # Compose files pair AGENT_SERVER_IMAGE_REPOSITORY with AGENT_SERVER_IMAGE_TAG.
          # - Runtime repos (ghcr.io/.../runtime): tag must match OpenHands major.minor
          # - Agent-server repos (ghcr.io/.../agent-server): tag uses SDK version or
          #   commit hash, so just verify it is not empty.
          repo_pattern = re.compile(r"AGENT_SERVER_IMAGE_REPOSITORY[^}]*:-([^}]+)")
          tag_pattern = re.compile(r"AGENT_SERVER_IMAGE_TAG:-([^}]+)")

          for filepath in ["containers/dev/compose.yml", "docker-compose.yml"]:
              try:
                  with open(filepath) as f:
                      content = f.read()
              except FileNotFoundError:
                  warnings.append(f"{filepath}: file not found")
                  continue

              repos = repo_pattern.findall(content)
              tags = tag_pattern.findall(content)
              if not tags:
                  warnings.append(f"{filepath}: no AGENT_SERVER_IMAGE_TAG default found")
                  continue

              is_runtime = any("runtime" in r and "agent-server" not in r for r in repos)
              tag = tags[0]

              if is_runtime:
                  # Runtime image — tag should match OpenHands major.minor
                  version_match = re.match(r"(\d+\.\d+)", tag)
                  if version_match and version_match.group(1) != major_minor:
                      errors.append(
                          f"{filepath}: runtime image tag is '{tag}' (version {version_match.group(1)}), "
                          f"expected major.minor '{major_minor}'"
                      )
                  elif not version_match:
                      errors.append(
                          f"{filepath}: runtime image tag '{tag}' does not start with a version number"
                      )
                  else:
                      print(f"  ✔ {filepath} runtime image tag: {tag}")
              else:
                  # Agent-server image — accept version tags or commit hashes
                  print(f"  ✔ {filepath} agent-server image tag: {tag}")

          # ── 6. Report ─────────────────────────────────────────────────────
          print()
          if warnings:
              print("⚠ Warnings:")
              for w in warnings:
                  print(f"  {w}")
              print()

          if errors:
              print("❌ FAILED: Version inconsistencies found:\n")
              for e in errors:
                  print(f"  ✖ {e}")
              print(
                  "\nAll version numbers and Docker image tags must be consistent."
                  "\nSee .agents/skills/ship-release/SKILL.md for the full release checklist."
              )
              sys.exit(1)
          else:
              print("✅ All version numbers and Docker image tags are consistent.")
          PY
