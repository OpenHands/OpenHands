# Workflow that builds and pushes the OpenHands app and enterprise Docker images
# to ghcr.io, then cuts releases via release-please. Ordering the release jobs
# after the image builds guarantees a release tag is only pushed once the images
# for its commit exist, so tag-triggered consumers (tag-image.yml,
# bump-chart.yml) never see a tag whose images aren't published yet.
# Per-image build logic lives in .github/workflows/_build-image.yml.
name: Docker

on:
  push:
    branches:
      - main
      - "saas-rel-*"
      - "oss-rel-*"
      - "release/**"
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: true
        default: ""

# PR events share a group so pushes supersede each other; each commit on a release branch gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  build_app:
    name: App
    if: github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ghcr.io/openhands/openhands
      dockerfile: containers/app/Dockerfile

  build_enterprise:
    name: Enterprise
    if: github.event.pull_request.head.repo.fork != true
    needs: build_app
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ghcr.io/openhands/enterprise-server
      dockerfile: enterprise/Dockerfile
      extra-build-args: OPENHANDS_VERSION=sha-${{ github.event.pull_request.head.sha || github.sha }}
      provenance: true
      sbom: true
      buildx-driver-opts: network=host

  # Release-please for the app (X.Y.Z, excludes enterprise/) and cloud
  # (cloud-X.Y.Z) release lines, moved here from a standalone push-triggered
  # workflow so the release cut is ordered after the image builds: a release
  # can't be tagged from a commit whose images failed, and everything driven by
  # the tag push finds the images already published. Release-PR upkeep on
  # ordinary merges is delayed by the build too; the next push catches it up.
  release_app:
    name: Release (app)
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: build_enterprise
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: OpenHands/release-actions/.github/workflows/release-please.yml@main

  release_cloud:
    name: Release (cloud)
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: build_enterprise
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: OpenHands/release-actions/.github/workflows/release-please.yml@main
    with:
      config-file: release-please-config.cloud.json
      manifest-file: .release-please-manifest.cloud.json

  update_pr_description:
    name: Update PR Description
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'
    needs: build_app
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get short SHA
        id: short_sha
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf 'SHORT_SHA=%s\n' "${PR_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Update PR Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHORT_SHA: ${{ steps.short_sha.outputs.SHORT_SHA }}
        shell: bash
        run: |
          echo "Updating PR description with Docker and uvx commands"
          bash "${GITHUB_WORKSPACE}/.github/scripts/update_pr_description.sh"
