name: Bug
description: Report a problem with OpenHands
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug! 🐛
        
        **Please fill out all required fields.** Issues missing critical information (version, installation method, reproduction steps, etc.) will be delayed or closed until complete details are provided.
        
        The team prioritizes bugs based on severity, impact, and available bandwidth. Clear, detailed reports help us resolve issues faster.

  - type: checkboxes
    attributes:
      label: Is there an existing issue for the same bug?
      description: Please search existing issues before creating a new one. If found, add a 👍 reaction or comment instead.
      options:
      - label: I have searched existing issues and this is not a duplicate.
        required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Clearly describe what went wrong. Be specific and concise.
      placeholder: Example - "When I run a Python task, OpenHands crashes after 30 seconds with a connection timeout error."
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Example - "OpenHands should execute the Python script and return results."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Example - "Connection timed out after 30 seconds, task failed with error code 500."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Provide clear, step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Install OpenHands using Docker
        2. Configure with Claude 3.5 Sonnet
        3. Run command: `openhands run "write a python script"`
        4. Wait 30 seconds
        5. Error appears
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: OpenHands Installation Method
      description: How are you running OpenHands?
      options:
        - Docker command in README
        - GitHub resolver
        - Development workflow
        - CLI
        - app.all-hands.dev
        - Other
      default: 0
    validations:
      required: true

  - type: input
    id: openhands-version
    attributes:
      label: OpenHands Version
      description: What version are you using? Find this in settings or by running `openhands --version`
      placeholder: ex. 0.9.8, main, commit hash, etc.
    validations:
      required: true

  - type: input
    id: model-name
    attributes:
      label: Model Name
      description: Which LLM model are you using?
      placeholder: ex. gpt-4o, claude-3-5-sonnet-20241022, openrouter/deepseek-r1, etc.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - MacOS
        - Linux
        - WSL on Windows
        - Windows (Docker Desktop)
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if using web UI)
      description: If applicable, which browser and version?
      placeholder: ex. Chrome 131, Firefox 133, Safari 17.2

  - type: input
    id: runtime-info
    attributes:
      label: Runtime Environment
      description: Python version, Node version, or other relevant runtime details
      placeholder: ex. Python 3.11.8, Node 20.11.0

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: |
        **Paste relevant logs, error messages, or stack traces.** Use code blocks (```) for formatting.
        
        LLM logs are in `logs/llm/default/`. Include timestamps if errors occurred at a specific time.
      placeholder: |
        ```
        Paste error logs here
        ```

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots and Additional Context
      description: |
        Add screenshots, videos, or other context that helps explain the issue.
        
        💡 **Tip:** Click the 👎 button in the chat UI to generate a shareable link to your conversation history.
      placeholder: Drag and drop screenshots here, or paste links.

  - type: markdown
    attributes:
      value: |
        ---
        **Note:** Issues with incomplete information may be closed or deprioritized. The maintainer team has limited bandwidth and prioritizes well-documented bugs that are easier to reproduce and fix. Thank you for your understanding! 🙏
