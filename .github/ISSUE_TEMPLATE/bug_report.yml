name: Bug Report
description: Report a bug or unexpected behavior in Agent Canvas.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      description: How did you install / run Agent Canvas?
      options:
        - npm (`npx @openhands/agent-canvas` or `npm install -g @openhands/agent-canvas`)
        - Docker (`ghcr.io/openhands/agent-canvas`)
        - From source (`npm run dev` / `npm run dev:minimal`)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Agent Canvas Version
      description: "npm: `agent-canvas --version` · Docker: the image tag you pulled (e.g. `ghcr.io/openhands/agent-canvas:latest`)"
      placeholder: "e.g. 1.0.0-alpha.6"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: |
        Step-by-step instructions to reproduce the behavior. To qualify for the
        `ready-for-dev` label, include how you ran Agent Canvas using one of
        these supported methods:
          - `npx @openhands/agent-canvas` (or `agent-canvas` if installed globally)
          - `npm run dev` / `npm run dev:minimal` (from a source checkout)
          - The hosted canvas at `app.all-hands.dev/canvas`
      placeholder: |
        Run method: `npm run dev`

        1. npm install && npm run dev
        2. Open http://localhost:8000
        3. …
        4. See error
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: |
        What actually happened? To qualify for the `ready-for-dev` label,
        describe the observed behavior with evidence suited to the bug: a real
        Canvas screenshot/video for visual behavior, or commands, logs, API
        output, or a focused reproducer/test for nonvisual behavior. Evidence
        linked in this issue's comments is also valid; no duplicate upload is needed.
      placeholder: |
        The button moved to the next step unexpectedly.

        The attached screenshot shows the observed error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error messages or console output. Content is auto-wrapped in a code block.
      render: shell
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: |
        Required for the `ready-for-dev` label. Testable, checkable bullets a
        reviewer can verify. Describe the *fixed* state, not the bug or required
        PR artifacts. Tests and before/after fix evidence are implementation
        checks, not prerequisites for triaging an unwritten fix.
      placeholder: |
        - [ ] Following the reproduction steps produces the expected result.
        - [ ] The affected mode handles the failure without losing user state.
        - [ ] …
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop or paste any screenshots that help explain the issue.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might be helpful (config, workarounds tried, etc.).
    validations:
      required: false
