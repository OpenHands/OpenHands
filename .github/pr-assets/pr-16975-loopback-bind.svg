<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" fill="#0d1117"/>
  <text x="24" y="36" fill="#8b949e" font-family="ui-monospace, Consolas, monospace" font-size="14">OpenHands #16879 / PR bind policy  GET / index.html</text>

  <text x="24" y="72" fill="#f85149" font-family="ui-monospace, Consolas, monospace" font-size="15">BEFORE  host 0.0.0.0 + session key (LAN-reachable)</text>
  <rect x="24" y="84" width="872" height="88" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="112" fill="#c9d1d9" font-family="ui-monospace, Consolas, monospace" font-size="13">window.__AGENT_CANVAS_SESSION_API_KEY__="&lt;redacted&gt;"</text>
  <text x="36" y="136" fill="#c9d1d9" font-family="ui-monospace, Consolas, monospace" font-size="13">localStorage['openhands-agent-server-config'].sessionApiKey = same key</text>
  <text x="36" y="160" fill="#f85149" font-family="ui-monospace, Consolas, monospace" font-size="13">hasKey=true  hasAuthRequired=false</text>

  <text x="24" y="212" fill="#3fb950" font-family="ui-monospace, Consolas, monospace" font-size="15">AFTER  host 0.0.0.0 without --allow-lan-session-key</text>
  <rect x="24" y="224" width="872" height="88" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="252" fill="#c9d1d9" font-family="ui-monospace, Consolas, monospace" font-size="13">window.__AGENT_CANVAS_AUTH_REQUIRED__=true</text>
  <text x="36" y="276" fill="#c9d1d9" font-family="ui-monospace, Consolas, monospace" font-size="13">session key NOT present in HTML</text>
  <text x="36" y="300" fill="#3fb950" font-family="ui-monospace, Consolas, monospace" font-size="13">hasKey=false  hasAuthRequired=true</text>

  <text x="24" y="348" fill="#58a6ff" font-family="ui-monospace, Consolas, monospace" font-size="15">LOOPBACK  host 127.0.0.1 (default) still auto-injects for local use</text>
  <text x="24" y="376" fill="#8b949e" font-family="ui-monospace, Consolas, monospace" font-size="13">Captured from startStaticServer() + fetch('http://127.0.0.1:&lt;port&gt;/') on this branch.</text>
  <text x="24" y="400" fill="#8b949e" font-family="ui-monospace, Consolas, monospace" font-size="13">Default listen address is now 127.0.0.1 so LAN GET / does not see the key.</text>
</svg>
