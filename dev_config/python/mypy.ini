[mypy]
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
explicit_package_bases = True
warn_unreachable = True
warn_redundant_casts = True
no_implicit_optional = True
strict_optional = True
disable_error_code = type-abstract

# Exclude third-party runtime directory from type checking
exclude = (third_party/|enterprise/)

[mypy-openhands.memory.condenser.impl.*]
disable_error_code = override

# Keep this suppression scoped to the legacy V0 conversation service only.
# In pre-commit's linux-platform run, mypy still reports a redundant-cast here
# even when isolated file checks are intermittently clean on Windows hosts.
[mypy-openhands.app_server.app_conversation.live_status_app_conversation_service]
disable_error_code = redundant-cast

[mypy-openai.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-litellm.*]
follow_imports = skip
ignore_missing_imports = True
