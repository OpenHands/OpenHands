repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|modules/|python/|openhands-ui/)
      - id: end-of-file-fixer
        exclude: ^(docs/|modules/|python/|openhands-ui/)
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: debug-statements


  - repo: local
    hooks:
      - id: warn-appmode-oss
        name: "Warn on AppMode.OSS in backend (use AppMode.OPENHANDS)"
        language: system
        entry: bash -lc 'if rg -n "\\bAppMode\\.OSS\\b" openhands tests/unit; then echo "Found AppMode.OSS usage. Prefer AppMode.OPENHANDS."; exit 1; fi'
        pass_filenames: false

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.5.1
    hooks:
      - id: pyproject-fmt
        args: [--keep-full-version]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.8
    hooks:
      # Run the linter.
      - id: ruff
        entry: ruff check --config dev_config/python/ruff.toml
        types_or: [python, pyi, jupyter]
        args: [--fix, --unsafe-fixes]
      # Run the formatter.
      - id: ruff-format
        entry: ruff format --config dev_config/python/ruff.toml
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        # To see gaps add `--html-report mypy-report/`
        entry: poetry run mypy --config-file dev_config/python/mypy.ini openhands/
        types: [python]
        pass_filenames: false
