[project]
name = "mcp-webscan"
version = "0.1.0"
description = "MCP server — web DAST (PROJETOSIN-187)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.28.0",
]

[project.scripts]
mcp-webscan = "server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]
