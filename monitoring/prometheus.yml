global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openhands'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenHands App
  - job_name: 'openhands-app'
    static_configs:
      - targets: ['openhands-app:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker containers
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    scrape_interval: 30s

  # SGLang (if exposes metrics)
  - job_name: 'sglang'
    static_configs:
      - targets: ['openhands-sglang:30000']
    metrics_path: '/metrics'
    scrape_interval: 30s

