########################
# OpenHands + Fleet + Gemini (native) - minimal config
#
# Usage:
#   poetry run python -m openhands.core.main -c fleet.toml
#
# Fill in:
# - [llm].api_key        (GEMINI_API_KEY)
# - [sandbox].fleet_api_key (FLEET_API_KEY)
########################

[core]
runtime = "openenv"
default_agent = "GeminiNativeCodeActAgent"

# Optional: stream LLM-call traces to Fleet Sessions (requires `fleet-python`)
fleet_session_export_enabled = true

[llm]
# Gemini-native agent uses this key to create google-genai client
api_key = "AIzaSyCOdaLW7dydVuaCXWlKF_jW0fuM5_tU7bU"  # GEMINI_API_KEY

# Gemini model; the agent will strip provider prefix (keeps "gemini-2.5-pro")
model = "gemini/gemini-2.5-pro"

[sandbox]
fleet_api_key = "sk_0PsOrNUDQ8ZLBEx7QdQCJ3pkObLi3nX05am4eY1Q"   # FLEET_API_KEY

[agent]
enable_mcp = true

# MCP screenshots/images returned by tools -> injected into next model prompt (when vision is active)
enable_mcp_image_injection = true
mcp_max_images_per_observation = 2


